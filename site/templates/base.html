<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbf9">
  <title>{% block title %}{{ full_title }}{% endblock %}</title>
  <meta name="description" content="{{ page_description or site_description }}">
  <link rel="canonical" href="{{ page_url }}">
  <link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ root }}apple-touch-icon.png">
  <link rel="manifest" href="{{ root }}site.webmanifest">
  <meta property="og:site_name" content="{{ site_title }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ca_ES">
  <meta property="og:title" content="{{ page_title or full_title }}">
  <meta property="og:description" content="{{ page_description or site_description }}">
  <meta property="og:url" content="{{ page_url }}">
  <meta property="og:image" content="{{ page_image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title or full_title }}">
  <meta name="twitter:description" content="{{ page_description or site_description }}">
  <meta name="twitter:image" content="{{ page_image }}">
  <link rel="stylesheet" href="{{ root }}static/fonts.css">
  <link rel="stylesheet" href="{{ root }}static/tokens.css">
  <link rel="stylesheet" href="{{ root }}static/base.css">
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
