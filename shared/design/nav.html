<script>
/* Keyboard protocol between a piece (iframe) and the shell. See DESIGN.md §8.
   ←/→  previous/next view inside the piece (links in .subnav, if any)
   j/k  next/previous piece (forwarded to the shell)
   Esc  back to the index (forwarded to the shell) */
(function () {
  function views() { return [].slice.call(document.querySelectorAll('.subnav a')); }
  function current(list) {
    for (var i = 0; i < list.length; i++) if (list[i].classList.contains('on')) return i;
    return 0;
  }
  function tell(msg) { try { parent.postMessage(msg, '*'); } catch (e) {} }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'j') { tell({ lcc: 'step', d: 1 }); }
    else if (e.key === 'k') { tell({ lcc: 'step', d: -1 }); }
    else if (e.key === 'Escape') { tell({ lcc: 'index' }); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var l = views(); if (l.length < 2) return;
      e.preventDefault();
      var n = (current(l) + (e.key === 'ArrowRight' ? 1 : -1) + l.length) % l.length;
      l[n].click(); l[n].focus({ preventScroll: true });
    }
  });
})();

/* Typography: curly apostrophes between letters (l'aire -> l’aire) in text that is
   read. Code, data and scripts are skipped. Runs once and again after the page
   updates its own text (animations, view changes). */
(function () {
  var SKIP = { SCRIPT: 1, STYLE: 1, PRE: 1, CODE: 1, TEXTAREA: 1, SVG: 1, svg: 1 };
  var RE = /(\p{L})'(\p{L})/gu;
  var busy = false;
  function fix(node) {
    if (node.nodeType === 3) {
      var v = node.nodeValue;
      if (v.indexOf("'") > -1) {
        var w = v.replace(RE, '$1’$2');
        if (w !== v) node.nodeValue = w;
      }
      return;
    }
    if (node.nodeType !== 1 || SKIP[node.tagName] || node.classList.contains('code') || node.classList.contains('seq')) return;
    for (var c = node.firstChild; c; c = c.nextSibling) fix(c);
  }
  function run() {
    if (busy) return;
    busy = true;
    fix(document.body);
    setTimeout(function () { busy = false; }, 0);
  }
  var t;
  function later() { clearTimeout(t); t = setTimeout(run, 60); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
  try { new MutationObserver(later).observe(document.body, { childList: true, subtree: true, characterData: true }); } catch (e) {}
})();
</script>
