<script>
/* Page behaviour shared by every piece. See DESIGN.md.
   j/k  next/previous piece (<link rel="next|prev"> in the head)
   Esc  back to the index (<link rel="up">)
   ←/→  previous/next tab, only on pages that still have tabs (.subnav a[data-sec]) */
(function () {
  var embedded = false;
  try { embedded = window.top !== window; } catch (e) { embedded = true; }
  function go(rel) {
    if (embedded) { try { parent.postMessage({ lcc: rel }, '*'); } catch (e) {} return; }   // the home page handles the keys
    var l = document.querySelector('link[rel="' + rel + '"]');
    if (l && l.href) location.href = l.href;
  }
  function tabs() { return [].slice.call(document.querySelectorAll('.subnav a[data-sec]')); }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'j') go('next');
    else if (e.key === 'k') go('prev');
    else if (e.key === 'Escape') go('up');
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var l = tabs(); if (l.length < 2) return;
      var cur = 0; l.forEach(function (a, i) { if (a.classList.contains('on')) cur = i; });
      e.preventDefault();
      var n = (cur + (e.key === 'ArrowRight' ? 1 : -1) + l.length) % l.length;
      l[n].click(); l[n].focus({ preventScroll: true });
    }
  });

  /* The sticky index: keep its height available to the page, and mark the section in view. */
  var nav = document.querySelector('.page > nav');
  function measure() { if (nav) document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px'); }
  window.addEventListener('resize', measure); measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  if (embedded) {
    /* On the home page a piece is shown in a frame as tall as its content: the method and the book
       page are folded under their headings (long content is shown in full), and the window height is handed in by the page. */
    [].slice.call(document.querySelectorAll('.sec > .label:first-child')).forEach(function (h) {
      var sec = h.parentNode;
      h.setAttribute('role', 'button'); h.tabIndex = 0; h.setAttribute('aria-expanded', 'false');
      var body = document.createElement('div'), inner = document.createElement('div');   // body opens and closes smoothly
      body.className = 'secbody'; inner.className = 'secin'; body.inert = true;
      while (h.nextSibling) inner.appendChild(h.nextSibling);
      body.appendChild(inner); sec.appendChild(body);
      function flip() { var on = sec.classList.toggle('open'); body.inert = !on; h.setAttribute('aria-expanded', on ? 'true' : 'false'); }
      h.addEventListener('click', flip);
      h.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    });
    if (nav && !document.querySelector('.subnav a[data-sec]')) nav.hidden = true;
    window.addEventListener('message', function (e) {
      if (e.data && e.data.lcc === 'vh') document.documentElement.style.setProperty('--vh', e.data.px + 'px');
    });
    /* Tell the page how tall this piece is, whenever it changes. */
    function reportHeight() {
      try { parent.postMessage({ lcc: 'height', px: Math.ceil(document.body.getBoundingClientRect().height) }, '*'); } catch (e) {}
    }
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
    window.addEventListener('load', reportHeight);
    reportHeight();
  }

  var jumps = [].slice.call(document.querySelectorAll('.subnav a[href^="#"]:not([data-sec])'));
  var targets = jumps.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function mark() {
    if (jumps.length < 2) return;
    var line = (nav ? nav.offsetHeight : 0) + window.innerHeight * 0.25;
    var cur = document.querySelector('.subnav a[data-sec]') ? -1 : 0;   // with tabs, the first jump is not current at the top
    targets.forEach(function (s, i) { if (s && s.getBoundingClientRect().top <= line) cur = i; });
    if (window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4) cur = jumps.length - 1;
    jumps.forEach(function (a, i) { a.classList.toggle('on', i === cur); });
  }
  window.addEventListener('scroll', mark, { passive: true });
  window.addEventListener('resize', mark);
  mark();
})();
</script>

<script>
/* Typography: curly apostrophes between letters (l'aire -> l’aire) in text that is
   read. Code, data and scripts are skipped. Runs once and again after the page
   updates its own text (animations, view changes). */
(function () {
  var SKIP = { SCRIPT: 1, STYLE: 1, PRE: 1, CODE: 1, TEXTAREA: 1, SVG: 1, svg: 1 };
  var RE = /(\p{L})'(\p{L})/gu;
  var busy = false;
  function fix(node) {
    if (node.nodeType === 3) {
      var v = node.nodeValue;
      if (v.indexOf("'") > -1) {
        var w = v.replace(RE, '$1’$2');
        if (w !== v) node.nodeValue = w;
      }
      return;
    }
    if (node.nodeType !== 1 || SKIP[node.tagName] || node.classList.contains('code') || node.classList.contains('seq')) return;
    for (var c = node.firstChild; c; c = c.nextSibling) fix(c);
  }
  function run() {
    if (busy) return;
    busy = true;
    fix(document.body);
    setTimeout(function () { busy = false; }, 0);
  }
  var t;
  function later() { clearTimeout(t); t = setTimeout(run, 60); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
  try { new MutationObserver(later).observe(document.body, { childList: true, subtree: true, characterData: true }); } catch (e) {}
})();
</script>
