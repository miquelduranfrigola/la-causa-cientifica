# The printed book that this site accompanies. Edited by hand.
title: La causa científica
author: Miquel Duran-Frigola
publisher: La Segona Perifèria
catalogue_url: https://www.lasegonaperiferia.cat/cataleg/
pages: 171
# Index (1-based) of the PDF page that carries printed page 1. Adjust once the
# PDF is in book/source/ (cover and front matter usually shift the numbering).
page_offset: 1
# Trim: how to cut the printer's marks away from the PDF pages.
#   "trimbox": use the PDF TrimBox (preferred; exported by InDesign with marks).
#   "margin": cut a fixed margin in millimetres from the MediaBox (set `margin_mm`).
trim: trimbox
margin_mm: 0
